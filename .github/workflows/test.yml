# 每次 push／PR 自動跑測試（STLC 第 5 階段的自動化部分），結果在 GitHub 的 Actions 頁籤看
name: 測試

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 後端整合測試
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mes
          POSTGRES_PASSWORD: mes_ci
          POSTGRES_DB: mes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mes" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mes:mes_ci@localhost:5432/mes_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -p 1 -count=1 -v ./...

  frontend:
    name: 前端型別檢查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
